name: Test

on:
  push:
    branches:
      - test

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows-x64
          - os: ubuntu-latest
            artifact: linux-x64
          - os: ubuntu-24.04-arm
            artifact: linux-arm64
          - os: macos-latest
            artifact: macos-arm64
          - os: macos-15-intel
            artifact: macos-x64
          - os: windows-11-arm
            artifact: windows-arm64
          # GitHub has no musl runners. These jobs run in the Alpine SDK image.
          - os: ubuntu-latest
            artifact: linux-musl-x64
            musl: true
          - os: ubuntu-24.04-arm
            artifact: linux-musl-arm64
            musl: true

    steps:
      # Sibling layout matches project references: ../../Crystal/...
      - name: Checkout CrystalCode
        uses: actions/checkout@v4
        with:
          path: CrystalCode

      - name: Checkout Crystal
        uses: actions/checkout@v4
        with:
          repository: YELANDAOKONG/Crystal
          path: Crystal

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        if: ${{ !matrix.musl }}
        working-directory: CrystalCode
        run: dotnet restore CrystalCode.sln

      - name: Test
        if: ${{ !matrix.musl }}
        working-directory: CrystalCode
        run: dotnet test CrystalCode.sln --configuration Release --no-restore

      # bash and git are not in the Alpine SDK image; the bash tool and
      # workspace tests need them.
      - name: Test (Alpine)
        if: ${{ matrix.musl }}
        run: >
          docker run --rm
          --volume "$GITHUB_WORKSPACE:/work"
          --workdir /work/CrystalCode
          mcr.microsoft.com/dotnet/sdk:10.0-alpine
          sh -euc 'apk add --no-cache bash git &&
          git config --global --add safe.directory '*' &&
          dotnet restore CrystalCode.sln &&
          dotnet test CrystalCode.sln --configuration Release --no-restore'

